# NZP FTEQW only - APK + carpeta aparte, rapido
name: Android apk CI NZP FTEQW only

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - '.github/workflows/android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        submodules: true

    - name: Setup jdk 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'
        cache: gradle

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential

    - name: Build FTEQW only
      run: |
        u=`whoami`
        sudo mkdir /mnt/diii4a
        sudo chown $u /mnt -R
        mv ./* /mnt/diii4a/
        cd /mnt/diii4a
        chmod +x ./gradlew
        arch=arm64-v8a
        barch="-Pabifilters=${arch} -PproductFlavor=idtech"
        rm -rf Q3E/libs/armeabi-v7a
        echo "Clean"
        ./gradlew clean
        rm -rf Q3E/.cxx Q3E/build idTech4Amm/build
        echo "Build FTEQW only - NZP PC 64-bit"
        bargs="$barch -Pcmake_options=-DGAME_DOOM3=OFF,-DGAME_DOOM3BFG=OFF,-DGAME_RTCW=OFF,-DGAME_QUAKE3=OFF,-DGAME_QUAKE2=OFF,-DGAME_QUAKE1=OFF,-DGAME_DOOM=OFF,-DGAME_ETW=OFF,-DGAME_REALRTCW=OFF,-DGAME_JK=OFF,-DGAME_SERIOUSSAM=OFF,-DGAME_URT=OFF,-DGAME_OPENMOHAA=OFF,-DGAME_WOLF3D=OFF,-DGAME_SKINDEEP=OFF,-DGAME_QC=OFF,-DGAME_ICARUS=OFF,-DGAME_XASH3D=OFF,-DGAME_SOURCE=OFF,-DGAME_TDM=OFF,-DGAME_FTEQW=ON,-DCMAKE_C_FLAGS=-w,-DCMAKE_CXX_FLAGS=-w"
        ./gradlew assembleRelease $bargs --console=plain -q
        echo "Build done"

    - name: Rename APK
      run: |
        cd /mnt/diii4a
        apk_file=NZP-FTEQW-`date "+%Y%m%d.%H%M%S"`_arm64.apk
        cp ./idTech4Amm/build/outputs/apk/release/idTech4Amm-release.apk $apk_file

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: /mnt/diii4a/*.apk
